<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>James • Greek practice</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#19283b;background:#f2f6fb}body{margin:0}.wrap{max-width:790px;margin:auto;padding:28px 18px}h1{margin:0;font-size:32px}p{line-height:1.5;color:#526477}.sub{margin:8px 0 24px}.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.cat,.answer,.back,.next{border:1px solid #d5dfeb;background:white;border-radius:14px;padding:17px;text-align:left;cursor:pointer;font-size:16px}.cat:hover,.answer:hover{border-color:#5679db}.cat strong{display:block}.cat small{color:#687a8d}.panel{background:white;border:1px solid #dae2ed;border-radius:18px;padding:25px;margin-top:18px;box-shadow:0 6px 24px #263b5710}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.back{padding:9px 14px}.bar{height:8px;border-radius:8px;background:#e6edf7;margin:18px 0;overflow:hidden}.fill{height:100%;background:#5573d7;transition:width .2s}.q{font-size:25px;font-weight:650;line-height:1.4;margin:20px 0}.answers{display:grid;gap:10px}.answer{width:100%}.correct{background:#e7f7ed;border-color:#33965c}.wrong{background:#fff0ed;border-color:#d95b51}.feedback{margin:18px 0;padding:15px;border-radius:12px;background:#f1f5fa;line-height:1.5}.next{background:#365fcb;color:white;text-align:center;border:0;margin-top:14px}.muted{font-size:13px;color:#69798d}.hidden{display:none}button:disabled{cursor:default;opacity:.75}</style><div class="wrap"><h1>🇬🇷 James • Greek Practice</h1><p class="sub">Updated with our latest lesson: new vocabulary, time expressions, future patterns and να + person. The original topics are still here.</p><div id="home"><div class="categories" id="categories"></div><p class="muted">Reading questions refer to our fictional practice story “Η οικογένειά μου”; some story details are invented for language practice.</p></div><div id="game" class="hidden"><div class="top"><button class="back" onclick="home()">← Topics</button><strong id="count"></strong></div><div class="panel"><h2 id="heading"></h2><div class="bar"><div class="fill" id="fill"></div></div><div id="question" class="q"></div><div class="answers" id="answers"></div><div id="feedback" class="feedback hidden"></div><button class="next hidden" id="next" onclick="advance()">Next →</button></div></div><div id="result" class="panel hidden"></div></div><script>const cats={"Articles & cases": [["___ πατέρας μου είναι Αμερικανός.", ["Ο", "Τον", "Του"], "Ο", "The father is the subject: nominative."], ["Αγαπάω ___ μητέρα μου.", ["η", "τη", "της"], "τη", "Direct object: accusative."], ["Μένω ___ Ελλάδα.", ["στην", "στης", "στη"], "στην", "σε + την = στην."], ["Έχω ___ γιο.", ["ένας", "έναν", "ενός"], "έναν", "After έχω, the object is accusative."], ["Μιλάω ___ γιαγιά μου.", ["στη", "της", "η"], "στη", "μιλάω σε + τη = στη."], ["Είμαι από ___ Ελλάδα.", ["η", "την", "της"], "την", "After από, the article is accusative."], ["___ παιδιά παίζουν.", ["Τα", "Τους", "Των"], "Τα", "Neuter plural nominative."], ["Βλέπω ___ φίλο μου.", ["ο", "τον", "του"], "τον", "Masculine accusative."]], "Four cases": [["___ είναι εδώ. (Dimitris, subject)", ["Ο Δημήτρης", "Τον Δημήτρη", "Δημήτρη"], "Ο Δημήτρης", "Nominative."], ["Βλέπω ___.", ["ο Δημήτρης", "τον Δημήτρη", "του Δημήτρη"], "τον Δημήτρη", "Accusative."], ["Το σπίτι ___ είναι μεγάλο.", ["ο Δημήτρης", "τον Δημήτρη", "του Δημήτρη"], "του Δημήτρη", "Genitive indicates possession."], ["___, έλα εδώ!", ["Ο Δημήτρης", "Δημήτρη", "Τον Δημήτρη"], "Δημήτρη", "Vocative addresses someone directly."], ["Καλημέρα, ___!", ["κύριος", "κύριο", "κύριε"], "κύριε", "Vocative of κύριος."], ["Η τσάντα ___ είναι εδώ.", ["η γυναίκα", "τη γυναίκα", "της γυναίκας"], "της γυναίκας", "Genitive."], ["___, πώς είσαι;", ["Μαρία", "Τη Μαρία", "Της Μαρίας"], "Μαρία", "Feminine name remains unchanged in vocative."], ["Καλησπέρα, ___!", ["Δημήτριος", "Δημήτριε", "Δημητρίου"], "Δημήτριε", "Formal name Δημήτριος → Δημήτριε."]], "Verbs": [["Εγώ ___ στην Αμερική.", ["μένω", "μένεις", "μένει"], "μένω", "First person singular."], ["Εσύ ___ δύο γιους.", ["έχω", "έχεις", "έχει"], "έχεις", "Second person singular."], ["Αυτός ___ σαράντα χρονών.", ["είμαι", "είσαι", "είναι"], "είναι", "Third person singular."], ["Εμείς ___ ελληνικά.", ["μαθαίνω", "μαθαίνουμε", "μαθαίνουν"], "μαθαίνουμε", "First person plural."], ["Τα παιδιά ___ στο σχολείο.", ["πηγαίνει", "πηγαίνεις", "πηγαίνουν"], "πηγαίνουν", "Third person plural."], ["Εγώ ___ την απάντηση.", ["ξέρω", "ξέρεις", "ξέρει"], "ξέρω", "First person singular."], ["Εσύ τι ___ το Σαββατοκύριακο;", ["κάνω", "κάνεις", "κάνει"], "κάνεις", "Second person singular."], ["Χθες ο Γιάννης ___ στο σπίτι.", ["είμαι", "ήταν", "είναι"], "ήταν", "Past tense of είμαι."]], "Family & plurals": [["Έχω δύο ___.", ["γιος", "γιους", "γιοι"], "γιους", "Accusative plural after έχω."], ["___ μου είναι στο σχολείο.", ["Οι γιοι", "Τους γιους", "Των γιων"], "Οι γιοι", "Nominative plural."], ["Το παιδί → ___", ["οι παιδί", "τα παιδιά", "τους παιδιά"], "τα παιδιά", "Neuter plural."], ["Η ταινία → ___", ["οι ταινίες", "τα ταινία", "οι ταινία"], "οι ταινίες", "Feminine plural."], ["Ο φίλος → ___", ["οι φίλοι", "οι φίλες", "τα φίλα"], "οι φίλοι", "Masculine -ος → -οι."], ["Η μητέρα ___ είναι Ελληνίδα.", ["μου", "με", "εγώ"], "μου", "Possessive: my."], ["Ο πατέρας της μητέρας μου είναι ο ___.", ["θείος", "παππούς", "γιος"], "παππούς", "Maternal grandfather."], ["Οι δύο ___ μου παίζουν ποδόσφαιρο.", ["γιος", "γιοι", "γιους"], "γιοι", "Subject: nominative plural."]], "Vocabulary & word building": [["χρόνος can mean...", ["time or year", "only clock", "only day"], "time or year", "Depends on context."], ["Σαββατοκύριακο means...", ["Saturday and Sunday", "Friday and Saturday", "Monday and Sunday"], "Saturday and Sunday", "Σάββατο + Κυριακή."], ["ποδόσφαιρο is literally...", ["foot + ball", "hand + ball", "water + sport"], "foot + ball", "πόδι + σφαίρα."], ["λεξικό means...", ["dictionary", "lesson", "library"], "dictionary", "Related to λέξη (word)."], ["ταινία means...", ["movie / film", "music", "book"], "movie / film", "Common everyday meaning."], ["βόλτα means...", ["walk / outing", "job", "question"], "walk / outing", "πάω βόλτα = go for a walk."], ["δουλειά means...", ["work / job", "school", "family"], "work / job", "Useful for talking about daily life."], ["τεχνικός διευθυντής means...", ["technical director", "music teacher", "medical doctor"], "technical director", "τεχνικός = technical; διευθυντής = director."]], "Reading comprehension": [["Ο Τζέιμς έχει...", ["δύο γιους", "τρεις κόρες", "έναν γιο"], "δύο γιους", "James has two sons."], ["Η μητέρα του Τζέιμς είναι...", ["Αμερικανίδα", "Ελληνίδα", "Ισπανίδα"], "Ελληνίδα", "His mother is Greek."], ["Ο Τζέιμς μένει τώρα...", ["στην Ελλάδα", "στην Αμερική", "στην Ισπανία"], "στην Αμερική", "According to the practice text."], ["Θέλει να μάθει...", ["ελληνικά", "γαλλικά", "γερμανικά"], "ελληνικά", "He wants to learn Greek."], ["Το Σαββατοκύριακο τα παιδιά...", ["παίζουν και βλέπουν ταινίες", "δουλεύουν στο γραφείο", "μένουν στο σχολείο"], "παίζουν και βλέπουν ταινίες", "According to the practice text."], ["Ο Τζέιμς θέλει να...", ["μετακομίσει στην Ελλάδα", "πάει στη Γερμανία", "μάθει ιαπωνικά"], "μετακομίσει στην Ελλάδα", "His goal is to move to Greece."]],"NEW • Lesson vocabulary":[["μετακομίζω means…", ["to relocate", "to cook", "to read"], "to relocate", "Moving home or to another city/country."], ["επειδή means…", ["because", "after", "soon"], "because", "Introduces a reason."], ["επιστρέφω means…", ["I return", "I wake up", "I ask"], "I return", "Come back or return."], ["βοηθάω means…", ["I help", "I watch", "I move"], "I help", "Also βοηθώ."], ["χρησιμοποιώ means…", ["I use", "I learn", "I wait"], "I use", "Related to χρήση = use."], ["το απόγευμα means…", ["afternoon", "morning", "evening"], "afternoon", "Historically από + γεύμα."], ["ρωτάω means…", ["I ask", "I come", "I go"], "I ask", "Also ρωτώ."], ["σύντομα means…", ["soon", "often", "together"], "soon", "Θα έρθω σύντομα."], ["μετά means…", ["afterwards", "because", "never"], "afterwards", "μετά το φαγητό = after the meal."], ["η έκφραση means…", ["expression", "explanation", "exercise"], "expression", "Plural: οι εκφράσεις."]],"NEW • Time & together":[["What time is it?", ["Τι ώρα είναι;", "Τι χρόνος είναι;", "Πόσο χρόνος είναι;"], "Τι ώρα είναι;", "ώρα = clock time / hour."], ["I have no time.", ["Δεν έχω χρόνο.", "Δεν έχω ώρα.", "Δεν είμαι χρόνο."], "Δεν έχω χρόνο.", "χρόνος = time available."], ["I wake up at eight.", ["Ξυπνάω στις οκτώ.", "Ξυπνάω στην οκτώ.", "Ξυπνάω με οκτώ."], "Ξυπνάω στις οκτώ.", "Use στις for most clock hours."], ["The children play together.", ["Τα παιδιά παίζουν μαζί.", "Τα παιδιά παίζουν μαζί μου.", "Τα παιδιά παίζουν χρόνος."], "Τα παιδιά παίζουν μαζί.", "μαζί = together."], ["Come with me!", ["Έλα μαζί μου!", "Έλα μαζί!", "Έλα συχνά!"], "Έλα μαζί μου!", "μαζί μου = with me."], ["I often read Greek.", ["Διαβάζω συχνά ελληνικά.", "Διαβάζω συχνός ελληνικά.", "Διαβάζω συχνό ελληνικά."], "Διαβάζω συχνά ελληνικά.", "συχνά = adverb."], ["A frequent mistake.", ["Ένα συχνό λάθος.", "Ένα συχνά λάθος.", "Μία συχνός λάθος."], "Ένα συχνό λάθος.", "συχνό agrees with neuter λάθος."]],"NEW • Future patterns":[["μετακομίζω → θα…", ["μετακομίσω", "μετακομίζω", "μετακομίσεις"], "μετακομίσω", "Many -ίζω verbs have perfective -ίσω."], ["συνεχίζω → θα…", ["συνεχίσω", "συνεχίζω", "συνεχίσεις"], "συνεχίσω", "Perfective stem: συνεχίσ-."], ["αρχίζω → θα…", ["αρχίσω", "αρχίζω", "αρχίσεις"], "αρχίσω", "Perfective stem: αρχίσ-."], ["μαθαίνω → θα…", ["μάθω", "μαθαίνεις", "μάθει"], "μάθω", "Learn the perfective stem μάθ-."], ["καταλαβαίνω → θα…", ["καταλάβω", "καταλαβαίνω", "καταλάβεις"], "καταλάβω", "Not every -αίνω verb behaves identically."], ["έρχομαι → θα…", ["έρθω", "έρχομαι", "έρθεις"], "έρθω", "Irregular perfective stem: έρθ-."], ["I will be learning every day.", ["Θα μαθαίνω κάθε μέρα.", "Θα μάθω κάθε μέρα.", "Θα μαθαίνεις κάθε μέρα."], "Θα μαθαίνω κάθε μέρα.", "Ongoing/repeated action."], ["I want to learn this word.", ["Θέλω να μάθω αυτή τη λέξη.", "Θέλω να μαθαίνω αυτή τη λέξη.", "Θέλω να μάθεις αυτή τη λέξη."], "Θέλω να μάθω αυτή τη λέξη.", "Focus on learning the word as a whole."]],"NEW • να & verb persons":[["I want YOU (singular) to learn.", ["Θέλω να μάθεις.", "Θέλω να μάθω.", "Θέλω να μάθει."], "Θέλω να μάθεις.", "The second verb agrees with εσύ."], ["I want YOU (plural) to come.", ["Θέλω να έρθετε.", "Θέλω να έρθω.", "Θέλω να έρθει."], "Θέλω να έρθετε.", "The second verb agrees with εσείς."], ["I want to come.", ["Θέλω να έρθω.", "Θέλω να έρθεις.", "Θέλω να έρθουν."], "Θέλω να έρθω.", "Same person: εγώ."], ["I want THEM to come.", ["Θέλω να έρθουν.", "Θέλω να έρθω.", "Θέλω να έρθετε."], "Θέλω να έρθουν.", "The second verb agrees with αυτοί/αυτές."], ["I want YOU to learn every day.", ["Θέλω να μαθαίνεις κάθε μέρα.", "Θέλω να μαθαίνω κάθε μέρα.", "Θέλω να μαθαίνει κάθε μέρα."], "Θέλω να μαθαίνεις κάθε μέρα.", "εσύ → μαθαίνεις."], ["We want to relocate.", ["Θέλουμε να μετακομίσουμε.", "Θέλουμε να μετακομίσω.", "Θέλουμε να μετακομίσει."], "Θέλουμε να μετακομίσουμε.", "εμείς → μετακομίσουμε."]]};let topic='',index=0,score=0,answered=false;const $=x=>document.getElementById(x);Object.entries(cats).forEach(([name,arr])=>{let b=document.createElement('button');b.className='cat';b.innerHTML='<strong>'+name+'</strong><small>'+arr.length+' questions • multiple choice</small>';b.onclick=()=>start(name);$('categories').append(b)});function start(name){topic=name;index=0;score=0;$('home').classList.add('hidden');$('result').classList.add('hidden');$('game').classList.remove('hidden');render()}function home(){$('home').classList.remove('hidden');$('game').classList.add('hidden');$('result').classList.add('hidden')}function render(){answered=false;let qs=cats[topic],q=qs[index];$('heading').textContent=topic;$('count').textContent=(index+1)+' / '+qs.length;$('fill').style.width=(index/qs.length*100)+'%';$('question').textContent=q[0];$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('answers').replaceChildren();q[1].forEach(opt=>{let b=document.createElement('button');b.className='answer';b.textContent=opt;b.onclick=()=>choose(opt,b);$('answers').append(b)})}function choose(opt,btn){if(answered)return;answered=true;let q=cats[topic][index],ok=opt===q[2];if(ok)score++;[...$('answers').children].forEach(b=>{b.disabled=true;if(b.textContent===q[2])b.classList.add('correct');else if(b===btn)b.classList.add('wrong')});$('feedback').textContent=(ok?'✓ Correct! ':'Not quite. Correct answer: '+q[2]+'. ')+q[3];$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');$('next').textContent=index===cats[topic].length-1?'See results →':'Next →'}function advance(){index++;if(index<cats[topic].length){render();return}$('game').classList.add('hidden');$('result').classList.remove('hidden');$('result').innerHTML='<h2>Great work!</h2><p>You got <strong>'+score+' / '+cats[topic].length+'</strong> correct in '+topic+'.</p><button class="next" onclick="start(topic)">Try this topic again ↻</button> <button class="back" onclick="home()">Choose another topic</button>'}</script></html>
